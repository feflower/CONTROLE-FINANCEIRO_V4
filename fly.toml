# fly.toml app configuration file generated for controle-financeiro-v4 on 2026-08-27T20:39:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'controle-financeiro-v4'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/financeiro.db'
  HOST = '0.0.0.0'
  PORT = '3000'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'dados'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
